databaseChangeLog:
  - changeSet:
      id: 001
      author: vdineka
      changes:
        - createTable:
            tableName: client
            columns:
              - column:
                  name: client_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false